name: Build & Deploy StopwatchApp to IIS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'src/StopwatchApp/StopwatchApp.csproj'
  PUBLISH_DIR: './publish'
  SITE_NAME: 'ouaail-stopwatch'
  DEPLOY_PATH: 'C:\inetpub\wwwroot\ouaail-stopwatch'
  BACKUP_ROOT: 'C:\deployments\backups'

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --no-restore --configuration Release

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ${{ env.PUBLISH_DIR }} --no-build

      - name: Zip published output
        run: zip -r publish.zip ${{ env.PUBLISH_DIR }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stopwatch-published
          path: publish.zip
          retention-days: 5

  deploy:
    name: Deploy to SIRIUS1
    runs-on: ubuntu-latest
    needs: build
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: stopwatch-published

      - name: Unzip published output
        run: unzip publish.zip

      - name: Prepare incoming folder on SIRIUS1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          shell: powershell
          script: |
            $incoming = "C:\deployments\incoming"
            $backups  = "C:\deployments\backups"
            if (Test-Path $incoming) { Remove-Item -Recurse -Force $incoming }
            New-Item -ItemType Directory -Path $incoming | Out-Null
            if (!(Test-Path $backups)) { New-Item -ItemType Directory -Path $backups | Out-Null }
            Write-Host "Folders ready."

      - name: Upload files to SIRIUS1 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "publish/*"
          target: "C:/deployments/incoming"
          strip_components: 1
          overwrite: true

      - name: Run deployment script on SIRIUS1 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          shell: powershell
          script: |
            $siteName   = "ouaail-stopwatch"
            $deployPath = "C:\inetpub\wwwroot\ouaail-stopwatch"
            $sourcePath = "C:\deployments\incoming"
            $backupRoot = "C:\deployments\backups"
            $timestamp  = Get-Date -Format "yyyyMMdd_HHmmss"
            $backupPath = "$backupRoot\$siteName`_$timestamp"

            Write-Host "=========================================="
            Write-Host " Deploying: $siteName"
            Write-Host " Timestamp: $timestamp"
            Write-Host "=========================================="

            Import-Module WebAdministration

            Write-Host "[1/6] Stopping site and app pool..."
            Stop-WebSite    -Name $siteName -ErrorAction SilentlyContinue
            Stop-WebAppPool -Name $siteName -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2

            Write-Host "[2/6] Backing up current version..."
            if (Test-Path $deployPath) {
              Copy-Item -Recurse -Force $deployPath $backupPath
              Write-Host "      Backup saved: $backupPath"
            } else {
              Write-Host "      No existing files, skipping backup."
            }

            Write-Host "[3/6] Removing old files..."
            if (Test-Path $deployPath) {
              Remove-Item -Recurse -Force "$deployPath\*"
            } else {
              New-Item -ItemType Directory -Path $deployPath | Out-Null
            }

            Write-Host "[4/6] Copying new files..."
            Copy-Item -Recurse -Force "$sourcePath\*" $deployPath
            Write-Host "      Files deployed."

            Write-Host "[5/6] Starting site and app pool..."
            Start-WebAppPool -Name $siteName
            Start-Sleep -Seconds 3
            Start-WebSite    -Name $siteName

            Write-Host "[6/6] Verifying..."
            $siteState    = (Get-WebSite    -Name $siteName).State
            $appPoolState = (Get-WebAppPool -Name $siteName).State
            Write-Host "      Site     : $siteState"
            Write-Host "      App Pool : $appPoolState"

            if ($siteState -eq "Started" -and $appPoolState -eq "Started") {
              Write-Host "=========================================="
              Write-Host " SUCCESS - Site is LIVE"
              Write-Host " https://ouaail-stopwatch.ms-strategies.com"
              Write-Host "=========================================="
              exit 0
            } else {
              Write-Host "FAILED - Rolling back to $backupPath"
              Remove-Item -Recurse -Force "$deployPath\*"
              if (Test-Path $backupPath) {
                Copy-Item -Recurse -Force "$backupPath\*" $deployPath
                Start-WebAppPool -Name $siteName
                Start-Sleep -Seconds 2
                Start-WebSite    -Name $siteName
                Write-Host "Rollback complete."
              }
              exit 1
            }