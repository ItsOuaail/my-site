name: Build & Deploy StopwatchApp to IIS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'src/StopwatchApp/StopwatchApp.csproj'
  PUBLISH_DIR: './publish'

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --no-restore --configuration Release

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ${{ env.PUBLISH_DIR }} --no-build

      - name: Zip published output
        run: zip -r publish.zip ${{ env.PUBLISH_DIR }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stopwatch-published
          path: publish.zip
          retention-days: 5

  deploy:
    name: Deploy to SIRIUS1
    runs-on: ubuntu-latest
    needs: build
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout (for deploy.ps1)
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: stopwatch-published

      - name: Unzip published output
        run: unzip publish.zip

      - name: Prepare folders on SIRIUS1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: powershell -Command "if (Test-Path 'C:\deployments\incoming') { Remove-Item -Recurse -Force 'C:\deployments\incoming' }; New-Item -ItemType Directory -Path 'C:\deployments\incoming' | Out-Null; if (!(Test-Path 'C:\deployments\backups')) { New-Item -ItemType Directory -Path 'C:\deployments\backups' | Out-Null }; Write-Host 'Folders ready.'"

      - name: Upload published app to SIRIUS1
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "publish/*"
          target: "C:/deployments/incoming"
          strip_components: 1

      - name: Upload deploy.ps1 to SIRIUS1
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "scripts/deploy.ps1"
          target: "C:/deployments"
          strip_components: 1

      - name: Execute deploy.ps1 on SIRIUS1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: powershell -ExecutionPolicy Bypass -File "C:\deployments\deploy.ps1"